<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Jogo da Velha Neon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --neon-x: #00f7ff;
        --neon-o: #ff2edf;
        --bg: #050510;
      }

      * {
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #0a0a25, #020208);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }

      .game {
        width: 100%;
        max-width: 360px;
        padding: 25px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
        text-align: center;
      }

      h1 {
        margin-bottom: 10px;
        font-weight: 700;
        text-shadow: 0 0 15px var(--neon-x);
      }

      .status {
        margin-bottom: 20px;
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .cell {
        aspect-ratio: 1;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.8rem;
        cursor: pointer;
        transition: 0.25s;
        user-select: none;
      }

      .cell:hover {
        transform: scale(1.05);
        background: rgba(255, 255, 255, 0.15);
      }

      .cell.x {
        color: var(--neon-x);
        text-shadow: 0 0 15px var(--neon-x);
      }

      .cell.o {
        color: var(--neon-o);
        text-shadow: 0 0 15px var(--neon-o);
      }

      .winner {
        animation: pulse 0.8s infinite alternate;
      }

      @keyframes pulse {
        from {
          box-shadow: 0 0 10px #fff;
        }
        to {
          box-shadow: 0 0 30px #fff;
        }
      }

      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        border-radius: 15px;
        border: none;
        font-size: 1rem;
        cursor: pointer;
        background: linear-gradient(135deg, var(--neon-x), var(--neon-o));
        color: black;
        font-weight: bold;
        transition: 0.3s;
      }

      button:hover {
        filter: brightness(1.2);
      }
    </style>
  </head>

  <body>
    <div class="game">
      <h1>⚡ Neon Tic Tac Toe</h1>
      <div class="status" id="status">Vez do jogador X</div>
      <div class="board" id="board"></div>
      <button onclick="resetGame()">Reiniciar</button>
    </div>

    <!-- Sons -->
    <audio
      id="clickSound"
      src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.wav"
    ></audio>
    <audio
      id="winSound"
      src="https://assets.mixkit.co/sfx/preview/mixkit-game-level-completed-2059.wav"
    ></audio>
    <audio
      id="bgMusic"
      loop
      src="https://assets.mixkit.co/music/preview/mixkit-neon-gaming-1230.mp3"
    ></audio>

    <script>
      const board = document.getElementById("board");
      const statusText = document.getElementById("status");
      const clickSound = document.getElementById("clickSound");
      const winSound = document.getElementById("winSound");
      const bgMusic = document.getElementById("bgMusic");

      let currentPlayer = "X";
      let gameActive = true;
      let state = Array(9).fill("");

      const wins = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      // Mobile: inicia música ao primeiro toque
      document.body.addEventListener(
        "click",
        () => {
          bgMusic.volume = 0.4;
          bgMusic.play();
        },
        { once: true }
      );

      function createBoard() {
        board.innerHTML = "";
        state.forEach((_, i) => {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.addEventListener("click", () => play(i, cell));
          board.appendChild(cell);
        });
      }

      function play(index, cell) {
        if (!gameActive || state[index]) return;

        clickSound.currentTime = 0;
        clickSound.play();

        state[index] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer.toLowerCase());

        if (checkWin()) return;

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Vez do jogador ${currentPlayer}`;
      }

      function checkWin() {
        for (let combo of wins) {
          const [a, b, c] = combo;
          if (state[a] && state[a] === state[b] && state[a] === state[c]) {
            gameActive = false;
            statusText.textContent = `🔥 Jogador ${state[a]} venceu!`;
            document.querySelectorAll(".cell")[a].classList.add("winner");
            document.querySelectorAll(".cell")[b].classList.add("winner");
            document.querySelectorAll(".cell")[c].classList.add("winner");
            winSound.play();
            return true;
          }
        }

        if (!state.includes("")) {
          statusText.textContent = "⚡ Empate!";
          gameActive = false;
        }
        return false;
      }

      function resetGame() {
        currentPlayer = "X";
        gameActive = true;
        state = Array(9).fill("");
        statusText.textContent = "Vez do jogador X";
        createBoard();
      }

      createBoard();
    </script>
  </body>
</html>
